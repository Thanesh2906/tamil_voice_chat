[project]
name = "jarvis-ai"
version = "0.1.0"
description = "Tamil-speaking personal + coding + RAG + server monitoring assistant."
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "faster-whisper>=1.0.0",
  "sentence-transformers>=2.6",
  "qdrant-client>=1.7",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "piper-tts>=1.2 ; platform_system != 'Windows'",
]

[project.optional-dependencies]
edge = ["edge-tts>=6.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "packages*"]
