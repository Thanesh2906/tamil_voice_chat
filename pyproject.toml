[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tamil-voice-chat"
version = "0.2.0"
description = "Private multi-user Tamil/Tanglish voice assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.2,<3",
  "numpy>=1.26,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "alembic>=1.13,<2",
  "prometheus-client>=0.21,<1",
  "websockets>=12,<16",
  "qdrant-client>=1.7,<2",
  "pypdf>=4,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0,<2"]
rag-models = ["sentence-transformers>=2.6,<6"]
tts = ["piper-tts>=1.2,<2 ; platform_system != 'Windows'"]
models = [
  "faster-whisper>=1.0,<2",
  "sentence-transformers>=2.6,<6",
  "piper-tts>=1.2,<2 ; platform_system != 'Windows'",
]
edge = ["edge-tts>=6.1,<8"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "mypy>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["jarvis", "services", "packages"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = ["integration: requires disposable PostgreSQL and Qdrant services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"jarvis/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
