[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tamil-voice-chat"
version = "0.1.0"
description = "Private multi-user Tamil/Tanglish voice assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "faster-whisper>=1.0.0",
  "sentence-transformers>=2.6",
  "qdrant-client>=1.7",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "piper-tts>=1.2 ; platform_system != 'Windows'",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "prometheus-client>=0.20",
  "websockets>=12.0",
  "email-validator>=2.1",
]

[project.optional-dependencies]
edge = ["edge-tts>=6.1"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "packages*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "prometheus-client>=0.21,<1",
  "httpx>=0.27,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["packages", "services", "tests/test_smoke.py"]

[tool.ruff.lint.per-file-ignores]
"jarvis/app.py" = ["B008"]
