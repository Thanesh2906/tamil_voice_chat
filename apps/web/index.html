<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jarvis · push-to-talk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header>
    <h1>Jarvis</h1>
    <p id="status">disconnected</p>
  </header>

  <main>
    <form id="login-form">
      <label>Email <input id="email" type="email" autocomplete="username" required /></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" minlength="8" required /></label>
      <button type="submit">Sign in</button>
    </form>
    <label>Project <select id="project"><option value="">Personal (no RAG)</option></select></label>
    <section id="transcript">
      <h2>Transcript</h2>
      <p id="transcript-text">—</p>
    </section>

    <section id="answer">
      <h2>Answer</h2>
      <pre id="answer-text"></pre>
      <audio id="player" controls hidden></audio>
    </section>

    <section>
      <h2>Sources</h2>
      <ul id="citations"><li>—</li></ul>
    </section>

    <button id="ptt" type="button" disabled>Hold to talk</button>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
