<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JARVIS Tamil Voice</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <main>
    <header><h1>JARVIS</h1><p>Private Tamil / Tanglish voice assistant</p></header>
    <form id="login-form">
      <label>Email <input id="email" type="email" autocomplete="username" required /></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" minlength="8" required /></label>
      <button type="submit">Sign in</button>
    </form>
    <section id="voice" hidden>
      <div class="toolbar">
        <label>Project <select id="project"><option value="">Personal (no RAG)</option></select></label>
        <button id="logout" type="button">Sign out</button>
      </div>
      <p id="status" role="status">Disconnected</p>
      <section><h2>Transcript</h2><p id="transcript-text">—</p></section>
      <section><h2>Answer</h2><pre id="answer-text"></pre><audio id="player" controls hidden></audio></section>
      <section><h2>Sources</h2><ul id="citations"><li>—</li></ul></section>
      <div class="toolbar">
        <button id="ptt" type="button" disabled>Hold to talk</button>
        <button id="cancel" type="button" disabled>Cancel</button>
      </div>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
