# Phase 1 laptop prototype: every backing service in one compose.
# See blueprint §8 for what to move when you graduate to a home server.

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.7.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose: ["6333"]
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      retries: 10

  llm:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.3.14}
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    expose: ["11434"]
    environment:
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b-instruct-q5_K_M}
    # Pull a quantized Tamil-capable model on first boot.
    entrypoint:
      - sh
      - -c
      - |
        ollama serve & pid=$$!;
        sleep 5;
        ollama pull "$${LLM_MODEL:-llama3.1:8b-instruct-q5_K_M}";
        wait $$pid
    command: []

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      llm: {condition: service_started}
      stt: {condition: service_started}
      tts: {condition: service_started}
      rag: {condition: service_started}
      monitoring: {condition: service_started}
    environment:
      JARVIS_ENV: ${JARVIS_ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jarvis_chunks}
      LLM_BASE_URL: http://llm:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b-instruct-q5_K_M}
      LLM_ALLOW_CLOUD: ${LLM_ALLOW_CLOUD:-false}
      # Secrets are injected only into the backend, never frontend build arguments.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.1-405b-instruct}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4.7}
      SELF_HOSTED_BASE_URL: ${SELF_HOSTED_BASE_URL:-}
      SELF_HOSTED_MODEL: ${SELF_HOSTED_MODEL:-}
      SELF_HOSTED_API_KEY: ${SELF_HOSTED_API_KEY:-}
      SELF_HOSTED_LOCAL: ${SELF_HOSTED_LOCAL:-false}
      STT_URL: http://stt:8000
      TTS_URL: http://tts:8000
      RAG_URL: http://rag:8000
      MONITORING_URL: http://monitoring:8000
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:8080","http://localhost:5173","http://localhost:3001"]}'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random characters)}
      RAG_ALLOWED_ROOTS: '${RAG_ALLOWED_ROOTS:-["/workspace"]}'
      TOOLS_UNSAFE_HOST_EXECUTION: ${TOOLS_UNSAFE_HOST_EXECUTION:-false}
      DOCKER_ALLOWED_CONTAINERS: '${DOCKER_ALLOWED_CONTAINERS:-[]}'
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ALLOWED_REPOS: '${GITHUB_ALLOWED_REPOS:-[]}'
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_ALLOWED_RECIPIENTS: '${EMAIL_ALLOWED_RECIPIENTS:-[]}'
      SSH_ALLOWED_HOSTS: '${SSH_ALLOWED_HOSTS:-[]}'
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    # An empty managed volume, not the host filesystem or Docker socket.
    # Mount only an explicitly approved project folder using a private override.
    volumes:
      - project_workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/readyz"]
      interval: 15s
      retries: 10

  stt:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: stt
    restart: unless-stopped
    command: ["uvicorn", "services.stt:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      STT_MODEL: ${STT_MODEL:-small}
      STT_LANGUAGE: ${STT_LANGUAGE:-auto}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      retries: 10

  tts:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: tts
    restart: unless-stopped
    command: ["uvicorn", "services.tts:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TTS_ENGINE: ${TTS_ENGINE:-piper}
      TTS_VOICE: ${TTS_VOICE:-ta-IN-default}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      retries: 10

  rag:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: rag
    restart: unless-stopped
    command: ["uvicorn", "services.rag:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on: [qdrant]
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-jarvis_chunks}
      RAG_ALLOWED_ROOTS: '${RAG_ALLOWED_ROOTS:-["/workspace"]}'
    volumes:
      - project_workspace:/workspace:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      retries: 10

  monitoring:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: monitoring
    restart: unless-stopped
    command: ["uvicorn", "services.monitoring:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    expose: ["9090"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      retries: 10

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}

  node_exporter:
    image: prom/node-exporter:v1.7.0
    restart: unless-stopped
    # No host PID namespace or root filesystem mounts. These describe the
    # exporter container. Real host metrics need an independently secured agent.
    expose: ["9100"]

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.8-3.6.0-ubuntu22.04
    profiles: ["gpu"]
    restart: unless-stopped
    cap_add: ["SYS_ADMIN"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]
    expose: ["9400"]

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  grafana_data:
  project_workspace:
