global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          scope: host

  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
        labels:
          scope: gpu

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          scope: container

  - job_name: jarvis-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
          - stt:8000
          - tts:8000
          - rag:8000
          - monitoring:8000
