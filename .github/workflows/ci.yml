name: CI
on:
  pull_request:
  push:
    branches: [main]
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check .
      - run: python -m compileall -q packages services tests
      - run: docker compose -f infra/docker-compose.yml config
        env:
          JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-bytes
          POSTGRES_PASSWORD: ci-only-postgres-password
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install pip-audit && pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: docker compose config
        env: {GRAFANA_ADMIN_PASSWORD: ci-only-password}
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pip-audit
      - run: python -m pip install .
      - run: pip-audit

